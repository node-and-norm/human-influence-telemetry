name: HIT Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Check deterministic fixture formatting
        run: python scripts/check_fixture_format.py

      - name: Validate HIT 0.6.0 result release and preserved component contracts
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate.py 2>&1 | tee hit-validation-report.txt

      - name: Validate HIT 0.7.0 current-contract replication candidate
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate_v070_candidate.py 2>&1 | tee hit-v070-candidate-report.txt

      - name: Validate HIT 0.7.0 human-governed source-audit staging
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate_v070_source_audit.py 2>&1 | tee hit-v070-source-audit-report.txt

      - name: Validate HIT 0.7.0 recruitment contingency boundaries
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate_v070_recruitment_contingency.py 2>&1 | tee hit-v070-recruitment-contingency-report.txt

      - name: Check HIT v1 staging consistency and manual workbook controls
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate_v1_readiness.py 2>&1 | tee hit-v1-readiness-report.txt

      - name: Check HIT v1 implementation packet staging consistency
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate_v1_implementation_packet.py 2>&1 | tee hit-v1-implementation-packet-report.txt

      - name: Test readiness failure boundaries
        run: python scripts/test_v1_readiness.py

      - name: Validate public release and v1 status surfaces
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate_public_release_status.py 2>&1 | tee hit-public-release-status-report.txt

      - name: Validate v0.6.5 research-integrity package and generated figures
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_research_integrity_audit.py --check 2>&1 | tee hit-v065-research-integrity-report.txt

      - name: Run executable assessment conformance
        run: >-
          python -m src conformance --all --format json
          --output hit-conformance-report.json

      - name: Verify supplementary research tests
        run: |
          python scripts/validate_research_strengthening.py --check
          python scripts/test_research_strengthening.py
          python scripts/validate_solo_application.py --check
          python scripts/run_jev_claim_pilot.py --analyze research/strengthening/jev-live-001
          python scripts/run_jev_claim_pilot.py --analyze research/strengthening/jev-live-002

      - name: Smoke-test public CLI commands
        run: python scripts/validate_v050_cli.py

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hit-validation-reports
          path: |
            hit-validation-report.txt
            hit-v070-candidate-report.txt
            hit-v070-source-audit-report.txt
            hit-v070-recruitment-contingency-report.txt
            hit-v1-readiness-report.txt
            hit-v1-implementation-packet-report.txt
            hit-public-release-status-report.txt
            hit-v065-research-integrity-report.txt
            hit-conformance-report.json
          if-no-files-found: error
